name: Release

# Merge develop -> release: checks the build and tags the next version.
# Cloudflare Pages builds and deploys `release` on its own (it is that project's
# production branch, and `develop` gets preview deploys), so rolling back is done
# in the Cloudflare dashboard: Deployments -> pick an older one -> Rollback.

on:
  push:
    branches: [release]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Next version
        id: tag
        # package.json's version if it isn't tagged yet (bump it in the PR for
        # a minor or major release), otherwise the latest tag plus one patch.
        run: |
          v="v$(node -p "require('./package.json').version")"
          if git rev-parse -q --verify "refs/tags/$v" >/dev/null; then
            last=$(git tag -l 'v*' --sort=-v:refname | head -1)
            v="${last%.*}.$(( ${last##*.} + 1 ))"
          fi
          echo "tag=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
      # After the checks pass, so a failing build leaves no tag behind and
      # re-running the workflow picks the same version.
      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
